# Automatic checks on every push and pull request to main.
# The real private-link key never reaches CI: the build uses a throwaway key
# and its output is discarded (GitHub Pages keeps serving the committed docs/).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Site, agents et API (tests)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WOLFGUARD_PRIVATE_DIR: ${{ runner.temp }}\wolfguard-private
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Dépendances des tests navigateur
        run: |
          python -m pip install -r tests/requirements.txt
          python -m playwright install chromium

      - name: Clé de lien jetable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force $env:WOLFGUARD_PRIVATE_DIR | Out-Null
          $bytes = [byte[]]::new(32); [Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          @{ key = [Convert]::ToHexString($bytes).ToLower() } | ConvertTo-Json -Compress |
            Set-Content -Encoding ascii (Join-Path $env:WOLFGUARD_PRIVATE_DIR 'site-access.json')

      - name: Compilation du site
        run: npm run build

      - name: Tests (publication, Node, navigateur sans fenêtre)
        run: npm run test:ci

  server:
    name: Serveur (compilation)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci --no-audit --no-fund
      - name: Vulnérabilités connues des dépendances de production
        run: npm audit --omit=dev --audit-level=high
      - run: npx tsc --noEmit -p .
      - run: npm run lint
      - run: node --test tests/security.test.mjs
      - run: npm run build
